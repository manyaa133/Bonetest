services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cpu
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend/checkpoints:/app/checkpoints
      - ./backend/metrics:/app/metrics

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
